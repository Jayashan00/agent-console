# One-click deploy on Render's free tier.
#
# Note on storage: free web services cannot attach a persistent disk, so run
# history lives on the container's ephemeral filesystem and is cleared whenever
# the service spins down or redeploys. That is fine for a demo — every run is
# still fully persisted and replayable for the life of the instance — but for a
# deployment where history must survive, either attach a disk (paid instance) or
# point the store at Render Postgres.
services:
  - type: web
    name: agent-console
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Set ONE of these in the Render dashboard (marked sync:false so they are
      # never committed to the repo).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: AGENT_MAX_TOOL_CALLS_PER_STEP
        value: "3"
