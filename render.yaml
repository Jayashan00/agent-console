# One-click deploy on Render's free tier.
services:
  - type: web
    name: agent-console
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: claude-sonnet-4-5
      - key: DATA_DIR
        value: /app/data
    disk:
      name: run-data
      mountPath: /app/data
      sizeGB: 1
